# Norfolk ServiceHub demo — norfolk.shelfcompass.com
#
# Debian/Ubuntu layout:
#   sudo cp deploy/nginx/norfolk.shelfcompass.com.conf \
#       /etc/nginx/sites-available/norfolk.shelfcompass.com
#   sudo ln -s ../sites-available/norfolk.shelfcompass.com \
#       /etc/nginx/sites-enabled/norfolk.shelfcompass.com
# (or drop it into /etc/nginx/conf.d/ if your nginx has no sites-* layout)
#
# First-time TLS bootstrap: the ssl_certificate paths below exist only after
# certbot issues the certificate, so nginx -t fails until then. See
# deploy/README.md §4 for the bootstrap order (comment the 443 block once,
# run certbot, restore).
#
# Upstream: the compose file publishes the app on 127.0.0.1:8087 — if you
# changed that port there, change it in the two proxy_pass lines below.

server {
    listen 80;
    listen [::]:80;
    server_name norfolk.shelfcompass.com;

    # ACME HTTP-01 challenges (webroot flow; certbot --nginx can also inject
    # its own handler — keeping this costs nothing).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` on the listen directive works on every nginx; on >= 1.25.1 it is
    # deprecated in favour of a standalone `http2 on;` — swap if you prefer a
    # warning-free config test.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name norfolk.shelfcompass.com;

    ssl_certificate     /etc/letsencrypt/live/norfolk.shelfcompass.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/norfolk.shelfcompass.com/privkey.pem;
    # certbot usually also manages these (they exist once certbot is installed):
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HTTPS-only demo.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Match the app's 12 MiB request body limit (server/src/app.rs BODY_LIMIT).
    client_max_body_size 12m;

    # The app already gzip-compresses (tower-http CompressionLayer).
    gzip off;

    # Webhook handling and the built-in mock services can take 10–20 s.
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The app reads the FIRST XFF hop as the client IP (rate limits, audit),
    # so the proxy must own the whole chain: send $remote_addr, NOT
    # $proxy_add_x_forwarded_for (that would let clients spoof their IP by
    # supplying their own X-Forwarded-For). If another trusted proxy is ever
    # placed in front of this one, switch back to $proxy_add_x_forwarded_for.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        # Note: any add_header in a location replaces ALL server-level
        # add_headers — HSTS must be repeated here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8087;
    }

    location / {
        proxy_pass http://127.0.0.1:8087;
    }
}
