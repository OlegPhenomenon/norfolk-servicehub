[package]
name = "servicehub"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.12"
infer = "0.22.0"
printpdf = { version = "0.7", features = ["embedded_images"] }
qrcode = "0.14.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
totp-rs = "5"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit", "compression-gzip", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "servicehub"
path = "src/main.rs"

[lib]
name = "servicehub"
path = "src/lib.rs"

# Password hashing and hashing-heavy crates are slow in debug builds; optimise them even in dev/test.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# Keep debug builds small: line tables are enough for backtraces.
[profile.dev]
debug = "line-tables-only"
